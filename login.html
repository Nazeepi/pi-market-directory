<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Access | Pi Market Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-amber-400 mb-6 transition">
            <i class="fa-solid fa-arrow-left"></i> Back to Directory
        </a>

        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-purple-600 flex items-center justify-center font-black text-2xl text-white shadow-lg mx-auto mb-3">
                π
            </div>
            <h1 class="text-2xl font-black text-slate-100">Merchant Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Sign in to manage your store and showcase items</p>
        </div>

        <div class="space-y-4">
            <button onclick="handlePiAuth()" class="w-full bg-gradient-to-r from-purple-700 to-purple-900 hover:from-purple-600 hover:to-purple-800 border border-purple-500/40 text-white font-bold py-3.5 px-4 rounded-2xl text-sm transition shadow-lg flex items-center justify-center gap-3">
                <i class="fa-solid fa-key text-amber-400"></i>
                <span>Sign In with Pi Browser Authenticator</span>
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-3 text-[11px] text-slate-500 uppercase font-semibold tracking-wider">Or Fast Guest Pass</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <a href="dashboard.html" class="block w-full text-center bg-slate-800 hover:bg-slate-700 border border-slate-700/60 text-slate-200 font-bold py-3 px-4 rounded-2xl text-sm transition">
                Continue to Merchant Dashboard &rarr;
            </a>
        </div>
    </div>

    <script>
        function handlePiAuth() {
            alert("Connecting to Pi Browser Authentication SDK...");
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
