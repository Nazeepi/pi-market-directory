<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Market Directory - Global Ecosystem</title>
    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #161e2e;
            --accent-purple: #8b5cf6;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* Header & Navigation */
        header {
            background-color: #111827;
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-auth-btn {
            background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Hero & Search Area */
        .hero {
            padding: 1.5rem 1rem;
            text-align: center;
            background: radial-gradient(circle at top, #1e1b4b, var(--bg-main));
        }

        .hero h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .search-box {
            margin: 1rem auto;
            max-width: 500px;
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid #374151;
            border-radius: 25px;
            overflow: hidden;
            padding: 5px 15px;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 8px;
            font-size: 0.9rem;
        }

        .search-box i {
            color: var(--text-muted);
        }

        /* Categories Bar */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            scrollbar-width: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #1f2937;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .cat-btn.active {
            background-color: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 0 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .product-info {
            padding: 10px;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #e2e8f0;
        }

        .product-price {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .buy-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-purple);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-store"></i> Pi Directory
        </div>
        <button class="user-auth-btn" id="authBtn" onclick="authenticateWithPi()">
            <i class="fa-solid fa-wallet"></i> Login
        </button>
    </header>

    <!-- Hero Area -->
    <div class="hero">
        <h1>Global Pi Marketplace</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Buy products & services directly with Pi Network</p>
        
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search products, merchants, or services...">
        </div>
    </div>

    <!-- Category Filter -->
    <div class="categories">
        <button class="cat-btn active">All</button>
        <button class="cat-btn">Electronics</button>
        <button class="cat-btn">Fashion</button>
        <button class="cat-btn">Services</button>
        <button class="cat-btn">Groceries</button>
    </div>

    <!-- Product Showcase -->
    <div class="products-grid">
        
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" class="product-img" alt="Headphones">
            <div class="product-info">
                <div class="product-title">Wireless Headphones</div>
                <div class="product-price"><i class="fa-solid fa-coins"></i> 15.00 Pi</div>
                <button class="buy-btn" onclick="payWithPi('Wireless Headphones', 15.00)">
                    <i class="fa-solid fa-bag-shopping"></i> Pay with Pi
                </button>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" class="product-img" alt="Smart Watch">
            <div class="product-info">
                <div class="product-title">Smart Fitness Watch</div>
                <div class="product-price"><i class="fa-solid fa-coins"></i> 25.50 Pi</div>
                <button class="buy-btn" onclick="payWithPi('Smart Fitness Watch', 25.50)">
                    <i class="fa-solid fa-bag-shopping"></i> Pay with Pi
                </button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" class="product-img" alt="Sneakers">
            <div class="product-info">
                <div class="product-title">Sports Running Shoes</div>
                <div class="product-price"><i class="fa-solid fa-coins"></i> 18.00 Pi</div>
                <button class="buy-btn" onclick="payWithPi('Sports Running Shoes', 18.00)">
                    <i class="fa-solid fa-bag-shopping"></i> Pay with Pi
                </button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-list"></i> Categories
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i> Cart
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-user"></i> Profile
        </a>
    </div>

    <!-- JavaScript & Pi SDK Logic -->
    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        // Auto authenticate on launch for Pi App Studio verification
        window.addEventListener('DOMContentLoaded', () => {
            authenticateWithPi();
        });

        async function authenticateWithPi() {
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes, function(payment) {
                    console.log("Incomplete payment found", payment);
                });
                
                document.getElementById('authBtn').innerHTML = `<i class="fa-solid fa-check-circle"></i> @${auth.user.username}`;
                document.getElementById('authBtn').style.background = "#10b981";
            } catch (error) {
                console.error("Pi Auth Error:", error);
            }
        }

        function payWithPi(memo, amount) {
            Pi.createPayment({
                amount: amount,
                memo: `Purchase ${memo}`,
                metadata: { type: "e-commerce purchase" }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    console.log("Ready for approval", paymentId);
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert(`Biyayya ya kammala sak! Transaction ID: ${txid}`);
                },
                onCancel: function(paymentId) {
                    console.log("Cancelled", paymentId);
                },
                onError: function(error, payment) {
                    console.error("Payment error", error);
                }
            });
        }
    </script>
</body>
</html>
